<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIGIL">
<meta name="description" content="VIGIL – dein Krafttraining-Logbuch mit Progression, Statistiken und Game-Elementen. Offline.">
<title>VIGIL · Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b;--bg2:#0c0e13;--surface:#13161c;--surface2:#1a1e26;--surface3:#252a35;--line:#2a303c;
  --text:#eceef2;--muted:#8d95a5;--dim:#5c6473;
  --y:#e3b341;--y2:#b8892a;--y-soft:rgba(227,179,65,.12);--gold:linear-gradient(180deg,#f6d27a,#d9a83a 55%,#a8781e);--disp:'Cinzel','Times New Roman',serif;
  --blue:#5b8def;--blue2:#2c4a80;--blue-soft:rgba(91,141,239,.13);
  --green:#43d17a;--green-soft:rgba(67,209,122,.1);--red:#ff5d5d;--orange:#ffac4d;
  --r:14px;--nav:70px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --head:'Chakra Petch','Arial Narrow',Impact,sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100dvh;
  padding-bottom:calc(var(--nav) + var(--sb) + 24px);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body.timer-on{padding-bottom:calc(var(--nav) + var(--sb) + 104px)}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}
[hidden]{display:none!important}

/* night city backdrop */
.city{position:fixed;inset:0 0 auto 0;height:260px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 100% at 85% -10%,rgba(91,141,239,.20),transparent 70%),radial-gradient(ellipse 40% 60% at 10% 0%,rgba(255,210,31,.06),transparent 70%)}
.city svg{position:absolute;left:0;right:0;top:calc(var(--st) + 90px);width:100%;height:150px}
.city::after{content:'';position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,var(--bg))}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;padding-top:var(--st);background:rgba(7,8,11,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.05)}
.tb-in{max-width:560px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.22em}
.brand svg{width:34px;height:34px}
.lvl-chip{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--head);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.lvl-chip b{color:var(--y);font-size:14px}
.lvl-chip>span{white-space:nowrap}
@media (max-width:400px){.lvl-chip .mini{display:none}}
.lvl-chip .mini{width:44px;height:5px;border-radius:9px;background:var(--surface3);overflow:hidden}
.lvl-chip .mini i{display:block;height:100%;background:var(--y)}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 16px 0}
h1,h2,h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;font-weight:700}
h1{font-size:30px}
h2{font-size:19px;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:'';flex:none;width:7px;height:18px;background:var(--y);clip-path:polygon(0 0,100% 22%,100% 100%,0 78%)}
h3{font-size:17px}
p{margin:0 0 10px}
.eyebrow{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--y);margin-bottom:6px}
.muted{color:var(--muted)} .sm{font-size:13px} .grow{flex:1;min-width:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative}
.chamfer{clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.hero{background:linear-gradient(140deg,#1d2330 0%,#13161c 50%,#0e1422 100%);padding:20px 18px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;border-left:3px solid var(--y);pointer-events:none;clip-path:polygon(0 18px,100% 0,100% 100%,0 100%)}
.hero::after{content:'';position:absolute;right:-50px;top:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,210,31,.16),transparent 68%);pointer-events:none}
.hero h1{font-size:31px;margin-bottom:6px}
.hero>*{position:relative;z-index:1}

/* buttons */
.btn{min-height:56px;padding:0 20px;border-radius:12px;font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--surface2);border:1px solid var(--line);transition:transform .08s,background .15s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--y);color:#101114;border-color:var(--y);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);border-radius:0}
.btn.primary:active{background:var(--y2)}
.btn.block{width:100%}
.btn.xl{min-height:64px;font-size:19px}
.btn.sm{min-height:46px;font-size:14px;padding:0 14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn.danger-fill{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface2);border:1px solid var(--line)}
.icon-btn:active{background:var(--surface3)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface3);color:var(--muted)}
.pill.warn{background:rgba(255,172,77,.14);color:var(--orange)}
.pill.y{background:var(--y-soft);color:var(--y)}
.pill.b{background:var(--blue-soft);color:#a9c4ff}
.pill.g{background:var(--green-soft);color:var(--green)}

/* week pips */
.weekpips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.weekpips div{text-align:center;font-family:var(--head);font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.06em}
.weekpips span{display:block;height:8px;border-radius:3px;background:var(--surface3);margin-top:5px}
.weekpips .on span{background:var(--y);box-shadow:0 0 12px rgba(255,210,31,.5)}
.weekpips .today{color:var(--text)}

/* template rows */
.tpl{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;width:100%;text-align:left}
.tpl .day{flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.06em;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.tpl.today .day{background:var(--y);color:#111;border-color:var(--y)}
.tpl .go{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--surface3);color:var(--y)}
.tpl.today .go{background:var(--y);color:#111}

/* recommendations */
.rec{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--blue-soft);color:#c8d9ff;font-weight:600;font-size:15px;line-height:1.35;margin-bottom:8px}
.rec .ic{margin-top:1px}
.rec.up{background:var(--y-soft);color:var(--y)}
.rec.hold{background:rgba(255,172,77,.12);color:var(--orange)}
.rec.deload{background:rgba(255,93,93,.12);color:#ff9090}
.rec.return{background:var(--green-soft);color:var(--green)}
.rec.new{background:var(--surface2);color:var(--muted)}
.rec-list .rec{margin-bottom:6px}

/* history */
.hist{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left;min-height:62px}
.hist .d{flex:none;width:46px;text-align:center;font-family:var(--num);font-weight:700;font-size:20px;line-height:1}
.hist .d small{display:block;font-family:var(--head);font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:3px}

/* workout */
.wo-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 12px}
.wo-head h1{font-size:28px}
.progress{height:6px;background:var(--surface3);border-radius:9px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--y2),var(--y));transition:width .3s}
.ex{padding:14px}
.ex.complete{border-color:rgba(67,209,122,.35)}
.ex.skipped{opacity:.55}
.ex-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ex-n{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);font-family:var(--num);font-weight:700;font-size:18px;color:var(--y);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.ex.complete .ex-n{background:var(--green);color:#08140c;border-color:var(--green)}
.last{font-size:14px;color:var(--muted);margin:0 0 10px 2px}
.last b{color:var(--text);font-weight:600}
.set{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.set-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.set-no{flex:1;font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rpe-btn{min-height:46px;padding:0 14px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-family:var(--num);font-weight:600;font-size:17px}
.rpe-btn.on{border-style:solid;border-color:var(--blue);color:#b9cfff;background:var(--blue-soft)}
.check{width:88px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--y);color:#111;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);border-radius:0}
.check:active{background:var(--y2)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:62px}
.stepper>button{flex:none;width:50px;font-size:30px;font-weight:500;line-height:1;background:var(--surface2);color:var(--y)}
.stepper>button:active{background:var(--surface3)}
.stepper .val{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stepper input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-family:var(--num);font-size:29px;font-weight:700;padding:0;outline:none;line-height:1.05;font-variant-numeric:tabular-nums}
.stepper input:focus{color:var(--y)}
.stepper .u{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;white-space:nowrap}
.set.done{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--green-soft);border-color:rgba(67,209,122,.28);min-height:54px;padding:8px 12px}
.set.done .ck{width:30px;height:30px;border-radius:8px;background:var(--green);color:#08140c;display:grid;place-items:center;flex:none}
.set.done .sv{flex:1;font-family:var(--num);font-size:21px;font-weight:700}
.set.done .sn{font-family:var(--num);color:var(--muted);font-size:17px;width:14px}
.set.done .undo{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rpe-chip{font-family:var(--num);font-size:14px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:#b9cfff}
.ex-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
textarea.inp{min-height:96px;resize:vertical;padding:12px 14px;line-height:1.4}

/* cardio */
.rpe-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpe-grid button{min-height:60px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-family:var(--num);font-size:24px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rpe-grid button small{font-family:var(--body);font-size:9.5px;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.02em}
.rpe-grid button.on{background:var(--y);color:#111;border-color:var(--y)}
.rpe-grid button.on small{color:#3a3000}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:54px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;outline:none}
.inp:focus{border-color:var(--y)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.bigval{font-family:var(--num);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.bigval small{font-size:18px;color:var(--muted);font-weight:600;margin-left:4px}

/* timer bar */
.timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb));z-index:30;padding:8px 12px;background:linear-gradient(to top,rgba(7,8,11,.98),rgba(7,8,11,.85));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.t-in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:stretch;height:68px}
.t-in>button{flex:none;width:62px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-family:var(--num);font-size:20px;font-weight:700}
.t-in>button:active{background:var(--surface3)}
.t-mid{flex:1;position:relative;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--y);display:flex;align-items:center;justify-content:center;gap:12px}
.t-fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,210,31,.28),rgba(255,210,31,.12));transform-origin:left;transition:transform .25s linear}
.t-mid span{position:relative}
.t-lbl{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--y)}
#t-time{font-family:var(--num);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
.timerbar.ending .t-mid{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(255,210,31,.35)}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,12,16,.96);border-top:1px solid var(--line);padding-bottom:var(--sb);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.nav button.on{color:var(--y)}
.nav button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--y);box-shadow:0 0 12px var(--y)}
.nav .dot{position:absolute;top:10px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{min-height:46px;border-radius:9px;font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--y);color:#111}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface2);border-radius:12px;padding:12px 14px;min-width:0}
.tile .l{font-family:var(--head);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.tile .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:15px;color:var(--muted);margin-left:3px}
.tile .d{font-size:13px;font-weight:600;margin-top:4px;color:var(--muted)}
.up-c{color:var(--green)!important} .down-c{color:var(--red)!important} .eq-c{color:var(--muted)!important}
.verdict{font-family:var(--head);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.1}

.chart{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

.bar{height:10px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y2),var(--y));border-radius:99px}
.bar.b i{background:linear-gradient(90deg,var(--blue2),var(--blue))}

/* progress screen */
.lvl{display:flex;gap:16px;align-items:center}
.lvl svg{flex:none;width:92px;height:104px}
.rank{font-family:var(--head);font-size:clamp(20px,6.4vw,28px);font-weight:700;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.camp{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:12px 0 6px}
.camp span{height:34px;border-radius:4px;background:var(--surface3);display:grid;place-items:center;font-family:var(--num);font-size:13px;font-weight:700;color:var(--dim);position:relative}
.camp span.p0.past{background:var(--blue2);color:#cfdcff}
.camp span.p1.past{background:#3d6fc4;color:#fff}
.camp span.p2.past{background:var(--y2);color:#111}
.camp span.cur{outline:2px solid var(--y);outline-offset:1px;color:var(--text)}
.camp span.lw::after{content:'L';position:absolute;top:-7px;right:-3px;font-size:9px;background:var(--orange);color:#111;border-radius:4px;padding:0 3px;line-height:13px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phases div.on{color:var(--y)}
.mission{display:flex;gap:12px;align-items:center}
.mission .mi{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--surface3);color:var(--y)}
.mission.done .mi{background:var(--green);color:#08140c}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:6px}
.ach .ai{width:40px;height:40px;display:grid;place-items:center;background:var(--y);color:#111;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ach b{font-family:var(--head);text-transform:uppercase;font-size:14px;letter-spacing:.03em;line-height:1.15}
.ach span{font-size:12.5px;color:var(--muted);line-height:1.3}
.ach.locked{opacity:.5}
.ach.locked .ai{background:var(--surface3);color:var(--dim)}
.flame{color:var(--orange)}

/* lists / menus */
.mrow,.prow{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;text-align:left;font-weight:600;font-size:16px}
.mrow:active,.prow:active{background:var(--surface2)}
.mrow.danger{color:var(--red)}
.prow{justify-content:space-between}
.plist{max-height:42dvh;overflow:auto;margin:10px 0 14px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tgl:last-child{border-bottom:0}
.tgl input{appearance:none;-webkit-appearance:none;flex:none;width:54px;height:32px;border-radius:99px;background:var(--surface3);position:relative;transition:background .15s;cursor:pointer;margin:0}
.tgl input::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl input:checked{background:var(--y)}
.tgl input:checked::after{transform:translateX(22px);background:#111}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step button{width:46px;height:46px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:22px;color:var(--y)}
.mini-step b{min-width:64px;text-align:center;font-family:var(--num);font-size:22px}

/* template editor */
.ti{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ti-top{display:flex;gap:6px;margin-bottom:8px}
.ti-top .inp{min-height:48px;font-size:15px}
.ti-top .icon-btn{width:44px;height:48px}
.ti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ti-grid label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ti-grid input{margin-top:3px;min-height:46px;text-align:center;font-family:var(--num);font-size:20px;font-weight:700;padding:0 4px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.overlay.center{align-items:center;padding:20px;z-index:70}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + var(--sb));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet h2{margin-top:10px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--surface3);margin:0 auto 6px}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:400px;width:100%;animation:up .18s}
.dlg p{font-size:17px;margin-bottom:18px}
.dlg-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

.toasts{position:fixed;top:calc(var(--st) + 10px);left:0;right:0;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{max-width:520px;width:100%;background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:12px 16px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .2s;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(-10px)}
.toast.err{border-left-color:var(--red)}
.toast.go{border-left-color:var(--green)}
.toast.pr{background:var(--y);color:#111;border:0;text-align:center;padding:16px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);border-radius:0}
.toast.pr b{display:block;font-family:var(--head);font-size:24px;letter-spacing:.08em}
.confetti{position:fixed;inset:0;z-index:95;pointer-events:none}

.sum-hero{text-align:center;padding:10px 0 4px}
.sum-hero svg{width:64px;height:64px;margin:0 auto 8px;display:block}
.lvlup{text-align:center;padding:16px;background:var(--y);color:#111;margin:12px 0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.lvlup b{display:block;font-family:var(--head);font-size:26px;letter-spacing:.06em}
.pr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--y-soft);color:var(--y);border-radius:10px;margin-bottom:6px;font-weight:600}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty svg{margin:0 auto 10px;color:var(--dim)}
.divider{height:1px;background:var(--line);margin:14px 0}
table.rt{width:100%;border-collapse:collapse;font-size:15px}
table.rt td{padding:10px 4px;border-bottom:1px solid var(--line)}
table.rt td.n{text-align:right;font-family:var(--num);font-size:18px;font-weight:700;white-space:nowrap}
table.rt tr:last-child td{border-bottom:0}
/* Nox – sidekick */
.nox{display:block;overflow:visible;flex:none}
.nox .bob{animation:bob 3.2s ease-in-out infinite}
.nox .eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.nox .zz{animation:zz 2.6s ease-in-out infinite}
.nox .spark{animation:spark 1.8s ease-in-out infinite}
.nox .spark:nth-of-type(2){animation-delay:.6s}.nox .spark:nth-of-type(3){animation-delay:1.2s}
.nox.egg .bob{animation:wob 2.8s ease-in-out infinite;transform-origin:80px 158px}
.nox.hop .bob{animation:hop .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes wob{0%,66%,100%{transform:rotate(0)}72%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.chain{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.chain div{text-align:center;font-size:10px;color:var(--muted);font-weight:600;line-height:1.2}
.chain svg{width:100%;height:auto}
.chain .lk svg{filter:brightness(0) opacity(.45)}
.chain .cur{color:var(--y)}
.pbar{position:relative;height:14px;border-radius:99px;background:var(--surface3);margin:22px 0 22px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue2),var(--y))}
.pbar b{position:absolute;top:-4px;width:4px;height:22px;background:#fff;border-radius:2px;box-shadow:0 0 8px rgba(0,0,0,.6);transform:translateX(-50%)}
.pbar span{position:absolute;top:18px;font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-weight:600}
.pbar span.t{top:-18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes hop{30%{transform:translateY(-16px) rotate(-5deg)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
@keyframes spark{50%{opacity:.2}}
.nox-btn{flex:none;display:block;border-radius:16px}
.pet{position:relative;display:inline-block;flex:none;vertical-align:middle}
.pet .bob{position:absolute;inset:0;animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 88%}
.pet-img{width:100%;height:100%;object-fit:contain;display:block;-webkit-mask-image:radial-gradient(ellipse 60% 62% at 50% 52%,#000 46%,transparent 100%);mask-image:radial-gradient(ellipse 60% 62% at 50% 52%,#000 46%,transparent 100%);transition:filter .4s}
.pet::before{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,var(--el) 0%,transparent 66%);opacity:.18;animation:glowp 3s ease-in-out infinite}
.pet.st4::before,.pet.st5::before{opacity:.3}.pet.st6::before{opacity:.45;inset:-4%}
.pet-bg{position:absolute;inset:-14%;border-radius:26px;background-size:cover;background-position:center;opacity:.8;-webkit-mask-image:radial-gradient(ellipse 66% 66% at 50% 52%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 66% 66% at 50% 52%,#000 52%,transparent 100%)}
.chain .lk .pet-img{filter:brightness(0) opacity(.55)!important}.chain .pet .pt,.chain .pet-slots,.chain .pet-ring,.chain .pet-vb{display:none}
.pet-ring{position:absolute;left:12%;right:12%;bottom:-3%;height:14%;border-radius:50%;border:2px solid var(--ring);box-shadow:0 0 10px var(--ring);opacity:.8;animation:auraP 2.4s ease-in-out infinite}
.pet-vb{position:absolute;left:-4px;top:-4px;width:24px;height:24px;border-radius:7px;background:linear-gradient(#fff1a8,#ffd21f 50%,#b38f00);border:1.5px solid #05060a;display:grid;place-items:center;font:700 13px var(--head);color:#3a2c00}
.pet.tier5::after{content:'';position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,210,31,.28),transparent 65%);pointer-events:none;animation:glowp 3s ease-in-out infinite}
.pet-aura{position:absolute;left:4%;right:4%;bottom:-8%;height:42%;animation:auraP 2.4s ease-in-out infinite;pointer-events:none}
.pet-aura img{width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;border-radius:50%;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 60%,transparent 100%)}
.pet .pt{position:absolute;bottom:18%;width:5px;height:5px;border-radius:50%;background:var(--el);box-shadow:0 0 8px var(--el);opacity:0;animation:rise 2.8s ease-in infinite}
.pet .pt:nth-of-type(1){left:14%;animation-delay:0s}.pet .pt:nth-of-type(2){left:34%;animation-delay:.6s}.pet .pt:nth-of-type(3){left:56%;animation-delay:1.2s}.pet .pt:nth-of-type(4){left:76%;animation-delay:1.8s}.pet .pt:nth-of-type(5){left:88%;animation-delay:2.3s}
.pet.st1 .bob,.pet.st2 .bob{animation:wiggle 2.6s ease-in-out infinite}
.pet.st6 .bob{animation:power 2.4s ease-in-out infinite}
.pet.m-happy .bob{animation:happyB 1.3s ease-in-out infinite}
.pet.m-tired .pet-img{filter:saturate(.65) brightness(.82)}.pet.m-tired .bob{animation-duration:5s}
.pet.m-sleep .pet-img{filter:grayscale(.55) brightness(.62)}.pet.m-sleep .bob{animation:breathe 6s ease-in-out infinite}
.pet-z{position:absolute;top:2%;right:6%;font-family:var(--head);font-weight:700;font-size:22px;color:#a9c4ff;animation:zz 2.6s ease-in-out infinite}.pet-z small{font-size:14px}
.pet-spark{position:absolute;color:#ffd21f;font-style:normal;font-size:16px;animation:spark 1.4s ease-in-out infinite;text-shadow:0 0 8px #ffd21f}
.pet-spark:nth-of-type(1){top:8%;left:8%}.pet-spark:nth-of-type(2){top:20%;right:6%;animation-delay:.7s}
.pet-slots{position:absolute;right:-6px;bottom:-6px;display:flex;gap:3px}
.pet-slots img{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--y);object-fit:cover;background:#12151c;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.nox.hop .bob{animation:hop .7s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2%) scale(1.015,1.035)}}
@keyframes wiggle{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-3deg) translateY(-2%)}75%{transform:rotate(3deg) translateY(-2%)}}
@keyframes power{0%,100%{transform:scale(1)}45%{transform:scale(1.035) translateY(-2%)}50%{transform:scale(1.04) translateY(-2%) translateX(.6%)}55%{transform:scale(1.04) translateY(-2%) translateX(-.6%)}}

@keyframes glowp{50%{transform:scale(1.08);opacity:.45}}
@keyframes auraP{0%,100%{transform:scale(1,1);opacity:.85}50%{transform:scale(1.08,1.12);opacity:1}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-260%) scale(1.2);opacity:0}}

/* ---------- domain helpers ---------- */
const exById=id=>S.exercises.find(x=>x.id===id)||{id,name:'Unbekannte Übung',metric:'reps',load:'weight',step:2.5};
const metricUnit=ex=>ex.metric==='m'?'m':ex.metric==='s'?'Sek':'Wdh';
const metricName=ex=>(ex.metric==='m'?'Meter':ex.metric==='s'?'Sekunden':'Wiederholungen')+(ex.load==='bw'?' · Körpergewicht':'');
const wLabel=(w,ex)=>w>0?`${fmtKg(w)} kg`:w<0?`${fmtKg(-w)} kg Hilfe`:(ex.load==='bw'?'KG':'0 kg');
const stepFor=ex=>(ex.big&&S.profile.bigStep5)?5:(num(ex.step)||2.5);
const roundTo=(v,st)=>Math.round(v/st)*st;
function repRange(t){if(t.repMin==null&&t.repMax==null)return 'max';if(t.repMin==null||t.repMin===t.repMax)return String(t.repMax??t.repMin);if(t.repMax==null)return t.repMin+'+';return `${t.repMin}–${t.repMax}`;}
const targetStr=(t,ex)=>`${t.sets||'?'}×${repRange(t)} ${metricUnit(ex)}`;
function defaultTarget(ex){return ex.metric==='s'?{sets:3,repMin:30,repMax:45,rest:60}:ex.metric==='m'?{sets:3,repMin:30,repMax:30,rest:90}:{sets:3,repMin:8,repMax:12,rest:num(S.profile.restSec)||120};}
function sortedSessions(){return sortedCache||(sortedCache=[...S.sessions].sort((a,b)=>a.start-b.start));}
function exHistory(exId,excludeId){
  const out=[];
  for(const s of sortedSessions()){
    if(s.id===excludeId||s.kind!=='strength') continue;
    for(const e of s.entries||[]){
      if(e.exId!==exId||e.skipped) continue;
      const d=e.sets.filter(x=>x.done);
      if(d.length) out.push({session:s,entry:e,sets:d});
    }
  }
  return out;
}
function aggSets(d,ex){
  const c={e1rm:0,w:-Infinity,vol:0,reps:0,total:0};
  for(const x of d){const w=num(x.w),r=num(x.r);
    if(ex.metric==='reps') c.e1rm=Math.max(c.e1rm,e1rm(w,r));
    if(r>0) c.w=Math.max(c.w,w);
    c.reps=Math.max(c.reps,r); c.total+=r;
    if(ex.metric==='reps'&&w>0) c.vol+=w*r;}
  if(c.w===-Infinity) c.w=0;
  return c;
}
function exSeries(exId){
  const ex=exById(exId), m=new Map();
  for(const h of exHistory(exId)){const p=m.get(h.session.id);m.set(h.session.id,{x:h.session.start,sets:p?p.sets.concat(h.sets):h.sets});}
  return [...m.values()].map(o=>({x:o.x,...aggSets(o.sets,ex)}));
}
const doneSets=s=>(s.entries||[]).filter(e=>!e.skipped).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
function sessionVolume(s){let v=0;for(const e of s.entries||[]){if(e.skipped)continue;const ex=exById(e.exId);if(ex.metric!=='reps')continue;for(const x of e.sets)if(x.done&&num(x.w)>0)v+=num(x.w)*num(x.r);}return v;}
const lastSummary=(exId,excl)=>{const H=exHistory(exId,excl);if(!H.length)return '';const ex=exById(exId);const h=H[H.length-1];
  return fmtDate(h.session.start)+': '+h.sets.map(s=>`${num(s.w)>0||ex.load!=='bw'?fmtKg(num(s.w))+'×':''}${fmt(num(s.r),0)}`).join(' · ');};

/* ---------- PRs (derived) ---------- */
function derivedPR(){
  if(prCache) return prCache;
  const bests={},sessionPRs={},prList=[];
  for(const s of sortedSessions()){
    let n=0; const seen=new Set();
    if(s.kind==='strength') for(const e of s.entries||[]){
      if(e.skipped) continue;
      const ex=exById(e.exId), d=e.sets.filter(x=>x.done); if(!d.length) continue;
      const cur=aggSets(d,ex), b=bests[e.exId];
      if(b){
        const kinds=[];
        if(cur.e1rm>0&&cur.e1rm>b.e1rm+1e-6) kinds.push('e1rm');
        if(cur.w>0&&cur.w>b.w+1e-6) kinds.push('w');
        if(ex.load==='bw'&&cur.w<=0&&b.w<=0&&cur.reps>b.reps) kinds.push('reps');
        if(kinds.length&&!seen.has(e.exId)){n++;seen.add(e.exId);prList.push({sid:s.id,exId:e.exId,start:s.start,kinds,cur});}
        bests[e.exId]={e1rm:Math.max(b.e1rm,cur.e1rm),w:Math.max(b.w,cur.w),vol:Math.max(b.vol,cur.vol),reps:Math.max(b.reps,cur.reps),n:b.n+1};
      } else bests[e.exId]={...cur,n:1};
    }
    sessionPRs[s.id]=n;
  }
  return prCache={bests,sessionPRs,prList};
}
function prText(p){
  const ex=exById(p.exId);
  if(p.kinds.includes('e1rm')) return `${ex.name}: ${fmtKg(p.cur.w)} kg · e1RM ${fmt(p.cur.e1rm,1)} kg`;
  if(p.kinds.includes('w')) return `${ex.name}: ${fmtKg(p.cur.w)} kg`;
  return `${ex.name}: ${fmt(p.cur.reps,0)} ${metricUnit(ex)}`;
}

/* ---------- recommendations (double progression) ---------- */
function score(sets,ex){
  const w=Math.max(...sets.map(s=>num(s.w)));
  if(ex.metric==='reps'&&w>0) return Math.max(...sets.map(s=>e1rm(num(s.w),num(s.r))));
  if(w>0) return w*1000+Math.max(...sets.map(s=>num(s.r)));
  return sets.reduce((a,s)=>a+num(s.r),0);
}
function recommend(exId,target={},excludeId){
  const ex=exById(exId), H=exHistory(exId,excludeId), name=ex.name, unit=metricUnit(ex);
  if(!H.length) return {type:'new',w:null,reps:null,text:`${name}: erstes Mal – Startgewicht wählen`};
  const last=H[H.length-1], lw=Math.max(...last.sets.map(s=>num(s.w))), st=stepFor(ex);
  const lt=last.entry.target||{};
  const repMin=target.repMin!==undefined?target.repMin:(lt.repMin??null);
  const repMax=target.repMax!==undefined?target.repMax:(lt.repMax??null);
  const lastReps=last.sets.map(s=>num(s.r));
  if(last.entry.deload){
    const w=num(last.entry.deloadFrom)||roundTo(lw/0.9,2.5);
    return {type:'return',w,reps:lastReps,text:`${name}: Deload vorbei – zurück auf ${wLabel(w,ex)}`};
  }
  let stalls=0;
  for(let i=H.length-1;i>0;i--){
    if(H[i].entry.deload||H[i-1].entry.deload) break;
    if(score(H[i].sets,ex)>score(H[i-1].sets,ex)+1e-9) break;
    stalls++;
  }
  if(stalls>=3&&lw>0){
    const w=Math.floor(lw*0.9/2.5)*2.5;
    return {type:'deload',w,from:lw,reps:lastReps,text:`${name}: 3× Stillstand – Deload: ${fmtKg(w)} kg (−10 %) für eine Woche`};
  }
  const fail=h=>repMin!=null&&h.sets.some(s=>num(s.r)<repMin);
  if(H.length>=2&&fail(last)&&fail(H[H.length-2]))
    return {type:'hold',w:lw,reps:lastReps,text:`${name}: ${wLabel(lw,ex)} halten – 2× unter ${repMin} ${unit}. Sauber bleiben, gut schlafen.`};
  const tSets=lt.sets||target.sets||last.sets.length;
  if(repMax!=null&&last.sets.length>=tSets&&last.sets.every(s=>num(s.r)>=repMax)){
    const w=Math.round((lw+st)*100)/100;
    const txt=(ex.load==='bw'&&lw<=0)?(lw<0?`${name}: nächstes Mal ${wLabel(w,ex)}`:`${name}: obere Grenze geschafft – nächstes Mal +${fmtKg(st)} kg Zusatzgewicht`):`${name}: nächstes Mal ${fmtKg(w)} kg`;
    return {type:'up',w,reps:last.sets.map(()=>repMin??repMax),text:txt};
  }
  if(repMax==null){
    const tot=lastReps.reduce((a,b)=>a+b,0);
    return {type:'same',w:lw,reps:lastReps,text:`${name}: Ziel ${fmt(tot+1,0)} ${unit} gesamt (letztes Mal ${fmt(tot,0)})`};
  }
  return {type:'same',w:lw,reps:lastReps,text:`${name}: ${wLabel(lw,ex)} halten – Ziel: ${repMax} ${unit} in allen Sätzen`};
}

/* ---------- campaign / streak / weeks ---------- */
const PHASES=[{name:'Fundament',w:'Woche 1–4',desc:'Technik sauber, Basis legen'},{name:'Aufbau',w:'Woche 5–8',desc:'Gewichte konsequent steigern'},{name:'Dark Knight',w:'Woche 9–12',desc:'Volle Härte, neue Rekorde'}];
function campaign(){
  const start=mondayOf(parseDay(S.profile.campaignStart||dayKey()));
  const raw=Math.floor(daysBetween(start,new Date())/7)+1;
  const week=clamp(raw,1,12), phase=week<=4?0:week<=8?1:2;
  const end=addDays(start,84).getTime(), t0=start.getTime();
  const inCamp=S.sessions.filter(s=>s.start>=t0&&s.start<end);
  const perPhase=[0,0,0];
  inCamp.forEach(s=>{perPhase[Math.min(2,Math.floor(Math.floor(daysBetween(start,new Date(s.start))/7)/4))]++;});
  const target=Math.max(1,num(S.profile.weeklyTarget)||4);
  return {start,raw,week,phase,started:raw>=1,done:raw>12,light:raw>=1&&raw<=12&&[4,8,12].includes(raw),sessions:inCamp.length,total:12*target,perPhase,phaseTarget:4*target};
}
function weekCounts(){const m={};for(const s of S.sessions){const k=weekKey(new Date(s.start));m[k]=(m[k]||0)+1;}return m;}
function streakInfo(){
  const m=weekCounts(), t=Math.max(1,num(S.profile.weeklyTarget)||4), mon=mondayOf(new Date()), cur=m[dayKey(mon)]||0;
  let d=cur>=t?mon:addDays(mon,-7), streak=0;
  while((m[dayKey(d)]||0)>=t){streak++;d=addDays(d,-7);}
  let best=0,run=0; const keys=Object.keys(m).sort();
  if(keys.length){let w=parseDay(keys[0]);let guard=0;while(w<=mon&&guard++<600){if((m[dayKey(w)]||0)>=t){run++;best=Math.max(best,run);}else run=0;w=addDays(w,7);}}
  return {streak,best,cur,target:t};
}
function weekStats(mon,cut){
  const a=mon.getTime(), b=Math.min(addDays(mon,7).getTime(),cut??Infinity), d=derivedPR();
  const ss=S.sessions.filter(s=>s.start>=a&&s.start<b);
  const r={count:ss.length,sets:0,vol:0,prs:0,maxRun:0,runKm:0,runMin:0,boxMin:0,weighIns:0,hardBox:0,rpeSets:0,days:new Set()};
  for(const s of ss){
    r.days.add((new Date(s.start).getDay()+6)%7); r.prs+=d.sessionPRs[s.id]||0;
    if(s.kind==='strength'){
      r.vol+=sessionVolume(s);
      for(const e of s.entries) if(!e.skipped) for(const x of e.sets) if(x.done){r.sets++; if(x.rpe) r.rpeSets++;}
    } else if(s.kind==='run'){const km=num(s.cardio?.km);r.runKm+=km;r.runMin+=num(s.cardio?.min);r.maxRun=Math.max(r.maxRun,km);}
    else {r.boxMin+=num(s.cardio?.min); if(num(s.cardio?.rpe)>=8) r.hardBox++;}
  }
  const k0=dayKey(mon), k1=dayKey(new Date(b-1));
  r.weighIns=S.bodyweight.filter(e=>e.date>=k0&&e.date<=k1).length;
  return r;
}

const MISSION_POOL=[
  {id:'pr3',icon:'trophy',title:'Rekordwoche',desc:'Stelle 3 persönliche Rekorde auf',goal:3,calc:w=>w.prs},
  {id:'sets60',icon:'dumbbell',title:'Satz-Maschine',desc:'Schaffe 60 Arbeitssätze',goal:60,calc:w=>w.sets},

  {id:'run12',icon:'run',title:'Straßenpatrouille',desc:'Laufe diese Woche 12 km',goal:12,calc:w=>w.runKm,f:v=>fmt(v,1)+' km'},
  {id:'bw3',icon:'scale',title:'Kontrolle',desc:'Trage 3× dein Körpergewicht ein',goal:3,calc:w=>w.weighIns},

  {id:'rpe20',icon:'bolt',title:'Ehrliche Zahlen',desc:'Erfasse bei 20 Sätzen den RPE',goal:20,calc:w=>w.rpeSets},
];
function missionsFor(wk){
  let h=2166136261; for(const c of wk) h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return h/4294967296;};
  const idx=[...MISSION_POOL.keys()];
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  const out=[MISSION_FIXED,...idx.slice(0,2).map(i=>MISSION_POOL[i])];
  if((S.game.specials||[]).includes(wk)) out.push({id:'special',icon:'star',title:'Spezial-Mission',desc:'Schaffe 5 Einheiten diese Woche',goal:5,calc:w=>w.count});
  return out;
}
const goalOf=m=>typeof m.goal==='function'?m.goal():m.goal;
const descOf=m=>typeof m.desc==='function'?m.desc():m.desc;
function missionCompletions(){
  const weeks=new Set(); S.sessions.forEach(s=>weeks.add(weekKey(new Date(s.start)))); S.bodyweight.forEach(e=>weeks.add(weekKey(parseDay(e.date))));
  const now=weekKey(new Date()); let n=0;
  for(const wk of weeks){ if(wk>now) continue; const ws=weekStats(parseDay(wk)); for(const m of missionsFor(wk)) if(m.calc(ws)>=goalOf(m)) n++; }
  return n;
}

const RANKS=[{min:1,name:'Rekrut'},{min:4,name:'Wächter'},{min:8,name:'Beschützer'},{min:12,name:'Vollstrecker'},{min:17,name:'Legende'},{min:23,name:'Mythos'}];
const lvlAt=L=>75*(L-1)*L;
function levelOf(xp){let L=1;while(xp>=lvlAt(L+1))L++;return {L,cur:xp-lvlAt(L),need:lvlAt(L+1)-lvlAt(L)};}
const rankFor=L=>[...RANKS].reverse().find(r=>L>=r.min);
function sessionXP(s,d){
  const base=s.kind==='strength'?XP.session+doneSets(s)*XP.set+(d.sessionPRs[s.id]||0)*XP.pr:XP.session+Math.min(60,Math.round(num(s.cardio?.min)));
  return Math.round(base*((S.game.fx||{})[s.id]?.x||1));
}
function xpInfo(){
  if(xpCache) return xpCache;
  const d=derivedPR(); let xp=0; const per={};
  for(const s of S.sessions){per[s.id]=sessionXP(s,d);xp+=per[s.id];}
  const ach=Object.keys(S.game.unlocked).length, mis=missionCompletions();

}

function achCtx(){
  const ss=sortedSessions(), maxW={};
  let unassisted=false,night=false,maxVol=0,box=0,runKm=0,bwBench=false,chain=0,cur=0,prev=null;
  for(const s of ss){
    const hr=new Date(s.start).getHours(); if(hr>=21||hr<4) night=true;
    if(s.kind==='boxing') box++;
    if(s.kind==='run') runKm+=num(s.cardio?.km);
    if(s.kind==='strength'){maxVol=Math.max(maxVol,sessionVolume(s));
      for(const e of s.entries){ if(e.skipped) continue;
        for(const x of e.sets){ if(!x.done||num(x.r)<1) continue; const w=num(x.w);
          maxW[e.exId]=Math.max(maxW[e.exId]??-Infinity,w);
          if(e.exId==='pullup'&&w>=0) unassisted=true;
          if(e.exId==='bench'&&w>=bwAt(s.start)) bwBench=true; } } }
    const d=new Date(s.start);
    cur=(prev&&daysBetween(prev,d)<=7)?cur+1:1; chain=Math.max(chain,cur); prev=d;
  }
  const st=streakInfo(), wc=weekCounts();
  return {n:ss.length,maxW,unassisted,night,maxVol,box,runKm,bwBench,chain,prs:derivedPR().prList.length,
    lost:num(S.profile.startWeight)-currentBW(),bw:currentBW(),goal:num(S.profile.goalWeight),hasBW:S.bodyweight.length>0,
    fullWeek:Object.values(wc).some(v=>v>=st.target),bestStreak:st.best,camp:campaign()};
}
function checkAchievements(){
  const c=achCtx(), neu=[];
  for(const a of ACH){ if(S.game.unlocked[a.id]) continue; let ok=false; try{ok=!!a.test(c);}catch{} if(ok){S.game.unlocked[a.id]=Date.now();neu.push(a);} }
  if(neu.length) save(true);
  return neu;
}
function checkMissions(){
  const wk=weekKey(new Date()), ws=weekStats(mondayOf(new Date()));
  const seen=S.game.seenMissions[wk]||(S.game.seenMissions[wk]=[]), neu=[];
  for(const m of missionsFor(wk)) if(!seen.includes(m.id)&&m.calc(ws)>=goalOf(m)){seen.push(m.id);neu.push(m);}
  if(neu.length) save(true);
  return neu;
}

/* ---------- strength standards & percentiles (estimate) ---------- */
const MAIN=['squat','bench','deadlift','ohp'];
const STD={m:{ref:80,squat:[.75,1.25,1.5,2.25,2.75],bench:[.5,.75,1.25,1.75,2],deadlift:[1,1.5,2,2.5,3],ohp:[.35,.55,.8,1.05,1.35]},
           f:{ref:60,squat:[.5,.75,1.25,1.5,2],bench:[.25,.5,.75,1,1.5],deadlift:[.5,1,1.25,1.75,2.5],ohp:[.2,.35,.5,.75,1]}};
const STD_P=[5,20,50,80,95], LEVELS=['Anfänger','Einsteiger','Fortgeschritten','Stark','Elite'];
const sexKey=()=>S.profile.sex==='f'?'f':'m';
function ageNow(){const y=num(S.profile.birthYear);const a=new Date().getFullYear()-y;return y>1900&&a>=10&&a<100?a:null;}
function ageFactor(a){if(!a)return 1;if(a<18)return 1+(18-a)*.04;if(a<=35)return 1;if(a<=50)return 1+(a-35)*.01;return 1.15+(a-50)*.017;}
const normFactor=bw=>Math.pow(bw/STD[sexKey()].ref,1/3)*ageFactor(ageNow()??30);
function pctOf(exId,e1,bw){
  const std=STD[sexKey()][exId]; if(!std||!(e1>0)||!(bw>0)) return null;
  const r=e1/bw*normFactor(bw), pts=[[0,0],...std.map((v,i)=>[v,STD_P[i]]),[std[4]*1.3,99.5]];
  for(let i=0;i<pts.length-1;i++){const [a,pa]=pts[i],[b,pb]=pts[i+1];if(r<=b)return pa+(r-a)/(b-a)*(pb-pa);}
  return 99.5;
}
function liftInfo(exId){
  if(!S.exercises.find(x=>x.id===exId)) return null;
  const ser=exSeries(exId).filter(p=>p.e1rm>0); if(!ser.length) return null;
  const cur=Math.max(...ser.slice(-3).map(p=>p.e1rm)), bw=currentBW(), f=normFactor(bw), std=STD[sexKey()][exId];
  let lvl=-1; std.forEach((v,i)=>{if(cur/bw*f>=v)lvl=i;});
  const first=ser[0].e1rm, weeks=Math.max(1,(ser[ser.length-1].x-ser[0].x)/(7*864e5));
  const old=ser.filter(p=>p.x<Date.now()-28*864e5), base4=old.length?old[old.length-1].e1rm:first;
  return {exId,name:exById(exId).name,ser,cur,bw,pct:pctOf(exId,cur,bw),ratio:cur/bw,lvl,level:lvl>=0?LEVELS[lvl]:'Neuling',
    next:lvl<4?{name:LEVELS[lvl+1],kg:std[lvl+1]/f*bw}:null,first,gain:cur-first,gainPct:(cur/first-1)*100,perWeek:(cur-first)/weeks,gain4:cur-base4,
    pctSeries:ser.map(p=>({x:p.x,y:pctOf(exId,p.e1rm,bwAt(p.x))}))};
}
function strengthScore(){const L=MAIN.map(liftInfo).filter(Boolean);return L.length?L.reduce((a,l)=>a+l.pct,0)/L.length:null;}

/* growth = consistency + own strength gain; missed sessions cost points (pet can shrink) */
function growthInfo(){
  const t=Math.max(1,num(S.profile.weeklyTarget)||4), wc=weekCounts(), sessions=S.sessions.length, cur=mondayOf(new Date());
  let fullWeeks=0,missed=0,zeroWeeks=0,shielded=0;
  const buys=S.game.buys||[], shields=buys.filter(b=>b.id==='regen').map(b=>b.t).sort((a,b)=>a-b), snacks=buys.filter(b=>b.id==='protein').length;
  if(sessions){let w=mondayOf(new Date(Math.min(...S.sessions.map(s=>s.start)))),first=true,n=0;
    while(w<cur&&n++<520){const c=wc[dayKey(w)]||0;if(c>=t)fullWeeks++;if(!first&&c<t){if(shields.length&&shields[0]<addDays(w,7).getTime()){shields.shift();shielded++;}else{missed+=t-c;if(!c)zeroWeeks++;}}first=false;w=addDays(w,7);}
    if((wc[dayKey(cur)]||0)>=t)fullWeeks++;}
  const lifts=MAIN.map(liftInfo).filter(l=>l&&l.ser.length>=2), gainPct=lifts.length?lifts.reduce((a,l)=>a+Math.max(0,l.gainPct),0)/lifts.length:0;
  const gainPts=Math.floor(gainPct/3), plus=sessions+fullWeeks*3+gainPts+snacks*2, minus=missed*2+zeroWeeks*4;
  const curCount=wc[dayKey(cur)]||0, atRisk=Math.max(0,t-curCount);
  return {sessions,fullWeeks,gainPct,gainPts,missed,zeroWeeks,plus,minus,snacks,shielded,shieldsLeft:shields.length,pts:Math.max(0,plus-minus),atRisk,riskPts:shields.length?0:atRisk*2+(curCount?0:4)};
}

  if(si>0&&nx) L.push(`Noch ${Math.max(1,nx.min-gi.pts)} Wachstumspunkte bis „${nx.name}“. Wachsen ist hart – bleib dran!`);
  const wl=wallet(); if(wl.bal>=2) L.push(`Du hast ${wl.bal} Marken – schau mal im Shop vorbei. Ich hätte gern was Neues!`);
  const best=MAIN.map(liftInfo).filter(Boolean).sort((a,b)=>b.pct-a.pct)[0];
  if(best) L.push(`Dein ${best.name} ist stärker als bei ${fmt(best.pct,0)} % der Trainierenden deines Alters und Gewichts.`);
  const lost=num(S.profile.startWeight)-currentBW();
  if(S.bodyweight.length&&lost>=0.5) L.push(`Schon ${fmt(lost,1)} kg leichter – und trotzdem stärker. Genau so.`);
  const mis=missionsFor(weekKey(new Date())).find(x=>x.calc(ws)<goalOf(x));
  if(mis){const f=mis.f||(x=>fmt(x,0));L.push(`Mission „${mis.title}“: ${f(mis.calc(ws))} von ${f(goalOf(mis))}. Pack ma's!`);}

/* ---------- workout logic ---------- */
function makeEntry(exId,target,excludeId){
  const ex=exById(exId), rec=recommend(exId,target,excludeId), n=Math.max(1,num(target.sets)||3), sets=[];
  const defR=target.repMin??target.repMax??(ex.metric==='s'?30:ex.metric==='m'?30:8);
  for(let i=0;i<n;i++){
    const w=rec.w??(ex.load==='bw'?0:20);
    let r=rec.reps?(rec.reps[i]??rec.reps[rec.reps.length-1]):defR;
    if(rec.type==='up') r=target.repMin??target.repMax??r;
    sets.push({w,r,rpe:null,done:false});
  }
  return {id:uid(),exId,target:{...target},sets,skipped:false,deload:rec.type==='deload',deloadFrom:rec.type==='deload'?rec.from:undefined,
    rec:rec.text,recType:rec.type,last:lastSummary(exId,excludeId)};
}
function startWorkout(tplId){
  if(S.active){toast('Es läuft bereits ein Training.','err');ui.tab='train';render();return;}
  const t=S.templates.find(x=>x.id===tplId); if(!t) return;
  const c=campaign(), light=t.kind==='strength'&&c.light;
  const a={id:uid(),templateId:t.id,name:t.name,kind:t.kind,start:Date.now(),end:null,notes:'',light,entries:[],
    cardio:t.kind!=='strength'?{min:t.kind==='boxing'?60:30,km:t.kind==='run'?5:'',rpe:null}:null};
  for(const it of t.items) a.entries.push(makeEntry(it.exId,{sets:light?Math.max(1,num(it.sets)-1):num(it.sets),repMin:it.repMin,repMax:it.repMax,rest:it.rest}));
  ui.noxWork=light?'Leichte Woche: ein Satz weniger. Erholung macht stark.':(a.kind==='strength'?"Los geht's! Ich zähle mit.":a.kind==='run'?'Guten Lauf! Trag danach Dauer und Distanz ein.':'Hände hoch, Kinn runter. Viel Spaß beim Boxen!');
  S.active=a; save(true); requestWake(); ui.tab='train'; persistUI(); render(); scrollTo(0,0);
  buzz(40); toast(light?'Leichte Woche: 1 Satz weniger pro Übung.':`${t.name} gestartet – viel Kraft!`,'go');
}
const getEntry=id=>S.active?.entries.find(e=>e.id===id);
function livePR(e,s){
  if(e.prShown) return;
  const ex=exById(e.exId), b=derivedPR().bests[e.exId]; if(!b) return;
  const w=num(s.w), r=num(s.r); let msg=null;
  if(ex.metric==='reps'&&w>0&&r>0&&e1rm(w,r)>b.e1rm+1e-6) msg=`${ex.name}: ${fmtKg(w)} kg × ${fmt(r,0)} · e1RM ${fmt(e1rm(w,r),1)} kg`;
  else if(w>0&&r>0&&w>b.w+1e-6) msg=`${ex.name}: ${fmtKg(w)} kg`;
  else if(ex.load==='bw'&&w<=0&&b.w<=0&&r>b.reps) msg=`${ex.name}: ${fmt(r,0)} ${metricUnit(ex)}`;
  if(msg){e.prShown=true;celebratePR(msg);return true;}

}

/* ---------- charts (canvas, offline) ---------- */
const C={y:'#ffd21f',b:'#5b8def',c:'#4fd1c5',o:'#ffac4d',g:'#43d17a',grid:'#20252f',txt:'#7d8596'};
const charts=[];
function chartSlot(cfg){const id='ch'+charts.length;charts.push({id,cfg});return `<canvas class="chart" id="${id}" style="height:${cfg.height||200}px"></canvas>`;}

function drawChart(cv,cfg){
  const H=cfg.height||200, W=cv.parentElement.clientWidth||300, dpr=Math.min(window.devicePixelRatio||1,3);

  const X=x=>Pd.l+(x-x0)/(x1-x0)*pw, Y=y=>Pd.t+(1-(y-y0)/(y1-y0))*ph;
  const yf=cfg.yFmt||(v=>fmt(v,Math.abs(y1-y0)<5?1:0));
  g.lineWidth=1;g.strokeStyle=C.grid;g.fillStyle=C.txt;g.textAlign='right';g.textBaseline='middle';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);g.beginPath();g.moveTo(Pd.l,y);g.lineTo(W-Pd.r,y);g.stroke();g.fillText(yf(v),Pd.l-6,y);}

  if(cfg.goal!=null){const y=Y(cfg.goal);g.save();g.setLineDash([6,5]);g.strokeStyle=C.y;g.globalAlpha=.75;g.beginPath();g.moveTo(Pd.l,y);g.lineTo(W-Pd.r,y);g.stroke();g.restore();
    g.fillStyle=C.y;g.textAlign='right';g.textBaseline='bottom';g.fillText('Ziel '+fmt(cfg.goal,1),W-Pd.r,y-3);}
  if(cfg.bars){const bp=cfg.bars.points,bw=Math.max(6,Math.min(26,pw/Math.max(bp.length,1)*.55));g.fillStyle=cfg.bars.color||C.b;
    bp.forEach(p=>{const x=X(p.x),y=Y(p.y),h=Y(0)-y;g.beginPath();if(g.roundRect)g.roundRect(x-bw/2,y,bw,Math.max(h,1),[4,4,0,0]);else g.rect(x-bw/2,y,bw,Math.max(h,1));g.fill();});}
  for(const s of cfg.series||[]){const p=s.points;if(!p.length)continue;

function paceTxt(c){const m=num(c.min),k=num(c.km);if(!(m>0&&k>0))return '–';const p=m/k;return `${Math.floor(p)}:${pad(Math.round((p%1)*60)%60)}<small>/km</small>`;}

function cmp(a,b){if(a===b||(b>0&&Math.abs(a-b)/b<.02))return 0;return a>b?1:-1;}
const cmpCls=v=>v>0?'up-c':v<0?'down-c':'eq-c', cmpArrow=v=>v>0?'▲':v<0?'▼':'=';
function statsWeek(){

  const tile=(l,val,cur,prev,f)=>{const c=cmp(cur,prev);return `<div class="tile"><div class="l">${l}</div><div class="v">${val}</div><div class="d ${cmpCls(c)}">${cmpArrow(c)} Vorwoche ${f(prev)}</div></div>`;};

    <div class="verdict ${cmpCls(v)}">${word}</div><p class="muted" style="margin:4px 0 0">als die Vorwoche bis ${DAYS[new Date().getDay()]}${a.vol||b.vol?' (nach Volumen)':''}. Ganze Vorwoche: ${full.count} Einheiten · ${fmtT(full.vol)}</p>

    ${tile('Laufen',fmt(a.runKm,1)+'<small>km</small>',a.runKm,b.runKm,x=>fmt(x,1)+' km')}${tile('Boxen',fmt(a.boxMin,0)+'<small>min</small>',a.boxMin,b.boxMin,x=>fmt(x,0)+' min')}</div>`;

/* ---------- data export / import ---------- */
async function doExport(){
  try{
    const data=JSON.stringify({app:'VIGIL',exportedAt:new Date().toISOString(),...S},null,2);
    const name=`vigil-backup-${dayKey()}.json`;
    const file=new File([data],name,{type:'application/json'});
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    if(ios&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'VIGIL Backup'});return;}
    const url=URL.createObjectURL(file), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast('Backup exportiert: '+name,'go');
  }catch(e){if(e?.name!=='AbortError')toast('Export fehlgeschlagen: '+(e.message||e),'err');}
}
function doImport(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=async()=>{
    const f=inp.files?.[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      if(!d||typeof d!=='object') throw new Error('keine gültige Datei');
      if(!Array.isArray(d.sessions)||!Array.isArray(d.templates)||!Array.isArray(d.exercises)) throw new Error('keine VIGIL-Sicherung');
      if(!await confirmDlg(`Sicherung mit ${d.sessions.length} Trainings laden? Deine aktuellen Daten werden ersetzt.`,'Importieren',true)) return;
      try{localStorage.setItem(KEY+'.before-import',JSON.stringify(S));}catch{}
      S=migrate(d); timer=null; save(true); checkAchievements(); render(); toast('Import erfolgreich.','go');
    }catch(e){toast('Import fehlgeschlagen: '+(e.message||e),'err',4500);}
  };
  inp.click();
}

  seg:el=>{ui.seg=el.dataset.v;persistUI();render();},
  'bw-step':el=>{const i=$('#bw-in');i.value=fmtInput(Math.max(0,Math.round((num(i.value)+ +el.dataset.d)*10)/10));},
  'bw-save':()=>{const kg=num($('#bw-in').value),date=$('#bw-date').value||dayKey();if(!(kg>20&&kg<400)){toast('Bitte ein gültiges Gewicht eingeben.','err');return;}
    if(date>dayKey()){toast('Datum liegt in der Zukunft.','err');return;}
    S.bodyweight=S.bodyweight.filter(e=>e.date!==date);S.bodyweight.push({date,kg:Math.round(kg*10)/10});save(true);
    const na=checkAchievements(), nm=checkMissions();render();toast(`${fmt(kg,1)} kg gespeichert.`,'go');
    if(na.length||nm.length){confetti();fanfare();buzz([80,50,200]);na.forEach(a=>toast('Erfolg: '+a.name,'go',3500));nm.forEach(m=>toast('Mission erfüllt: '+m.title,'go',3500));}},
  'bw-del':async el=>{if(!await confirmDlg('Messung löschen?','Löschen',true))return;S.bodyweight=S.bodyweight.filter(e=>e.date!==el.dataset.d);save(true);render();},
  'rest-def':el=>{S.profile.restSec=clamp(num(S.profile.restSec)+ +el.dataset.d,15,600);save();render();},
  'camp-restart':async()=>{if(!await confirmDlg('Neue 12-Wochen-Kampagne ab dieser Woche starten?','Starten'))return;S.profile.campaignStart=dayKey(mondayOf(new Date()));save(true);render();toast('Kampagne gestartet – Phase Fundament.','go');},
  'tpl-edit':el=>openTplEditor(el.dataset.id), 'tpl-new':()=>openTplEditor(null),
  'di-add':()=>{draft.items.push({exId:S.exercises[0]?.id,sets:3,repMin:8,repMax:12,rest:num(S.profile.restSec)||120});setSheet(tplHTML());},
  'di-move':el=>{const L=draft.items,i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];setSheet(tplHTML());},
  'di-del':el=>{draft.items.splice(+el.dataset.i,1);setSheet(tplHTML());},
  'tpl-save':()=>{if(!draft.name.trim()){toast('Bitte einen Namen eingeben.','err');return;}
    const t=deep(draft);delete t._new;t.name=t.name.trim();t.items=t.items.filter(i=>i.exId).map(i=>({...i,sets:Math.max(1,Math.round(num(i.sets))||1)}));
    if(t.kind!=='strength') t.items=[];
    const i=S.templates.findIndex(x=>x.id===t.id);if(i>=0)S.templates[i]=t;else S.templates.push(t);save(true);closeSheet();render();toast('Vorlage gespeichert.','go');},
  'tpl-del':async()=>{if(!await confirmDlg(`Vorlage „${draft.name}“ löschen? Vergangene Trainings bleiben erhalten.`,'Löschen',true))return;S.templates=S.templates.filter(t=>t.id!==draft.id);save(true);closeSheet();render();},
  'tpl-reset':async()=>{if(!await confirmDlg('Standard-Vorlagen (Kraft A/B, Boxen, Laufen) wiederherstellen? Eigene Änderungen an diesen Vorlagen gehen verloren.','Wiederherstellen',true))return;
    const def=defaultTemplates();for(const t of def){const i=S.templates.findIndex(x=>x.id===t.id);if(i>=0)S.templates[i]=t;else S.templates.push(t);}
    for(const x of defaultExercises()) if(!S.exercises.find(e=>e.id===x.id)) S.exercises.push(x);save(true);render();},
  'ex-edit':el=>openExEditor(el.dataset.id), 'ex-new':()=>openExEditor(null),
  'xd-save':el=>{const name=$('#xd-name').value.trim();if(!name){toast('Bitte einen Namen eingeben.','err');return;}
    const x={id:el.dataset.id,name,metric:$('#xd-metric').value,load:$('#xd-load').value,step:num($('#xd-step').value)||2.5,big:$('#xd-big').checked};
    const i=S.exercises.findIndex(e=>e.id===x.id);if(i>=0)S.exercises[i]=x;else S.exercises.push(x);save(true);closeSheet();render();},
  'xd-del':async el=>{const id=el.dataset.id;
    if(S.sessions.some(s=>s.entries?.some(e=>e.exId===id))||S.active?.entries.some(e=>e.exId===id)){toast('Übung hat bereits Trainingsdaten und kann nicht gelöscht werden – umbenennen geht.','err',4500);return;}
    if(!await confirmDlg('Übung löschen? Sie wird auch aus Vorlagen entfernt.','Löschen',true))return;
    S.exercises=S.exercises.filter(e=>e.id!==id);S.templates.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));save(true);closeSheet();render();},
  export:()=>doExport(), import:()=>doImport(),
  reset:async()=>{if(!await confirmDlg('ALLE Daten löschen? Das kann nicht rückgängig gemacht werden. Exportiere vorher ein Backup!','Weiter',true))return;
    if(!await confirmDlg('Wirklich sicher? Alle Trainings, Gewichte und Erfolge werden gelöscht.','Endgültig löschen',true))return;
    S=defaultState();timer=null;releaseWake();save(true);ui.tab='train';render();toast('Alle Daten gelöscht.');},
  install:async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch{}deferredInstall=null;render();},
};
function cStep(k,dir){
  const c=S.active.cardio, st=k==='km'?.5:5;
  c[k]=Math.max(0,Math.round((num(c[k])+dir*st)*100)/100);
  const i=document.querySelector(`input[data-c="${k}"]`); if(i) i.value=fmtInput(c[k]);
  updatePace(); save();
}
function updatePace(){const p=$('#pace'),s=$('#speed');if(p)p.innerHTML=paceTxt(S.active.cardio);if(s)s.innerHTML=speedTxt(S.active.cardio);}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  unlockAudio();
  const fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault();
  try{fn(el,e);}catch(err){console.error(err);toast('Fehler: '+(err.message||err),'err',4000);}
});
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches('input[data-f],input[data-c],#bw-in')){t.dataset.old=String(num(t.value));setTimeout(()=>{try{t.select();}catch{}},0);}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('input[data-f]')&&S.active){const en=getEntry(t.dataset.e);if(!en)return;en.sets[+t.dataset.s][t.dataset.f]=num(t.value);save();return;}
  if(t.matches('input[data-c]')&&S.active){S.active.cardio[t.dataset.c]=num(t.value);updatePace();save();return;}
  if(t.matches('[data-notes]')&&S.active){S.active.notes=t.value;save();return;}
  if(t.matches('[data-search]')){const q=t.value.trim().toLowerCase();document.querySelectorAll('#plist .prow').forEach(r=>r.hidden=q&&!r.dataset.name.includes(q));return;}
  if(t.matches('[data-d]')&&draft){draft[t.dataset.d]=t.dataset.d==='day'?+t.value:t.value;return;}
  if(t.matches('[data-di]')&&draft){const it=draft.items[+t.dataset.di],f=t.dataset.df;it[f]=f==='exId'?t.value:(t.value.trim()===''?null:num(t.value));return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('input[data-f]')&&S.active){const en=getEntry(t.dataset.e);if(!en)return;const j=+t.dataset.s,f=t.dataset.f,v=num(t.value);en.sets[j][f]=v;t.value=fmtInput(v);if(f==='w')propagateW(en,j,num(t.dataset.old),v);save();return;}
  if(t.matches('input[data-c]')&&S.active){t.value=t.value===''?'':fmtInput(num(t.value));return;}
  if(t.matches('[data-stat-ex]')){ui.statEx=t.value;persistUI();render();return;}
  if(t.matches('[data-d="kind"]')&&draft){draft.kind=t.value;setSheet(tplHTML());return;}
  if(t.matches('[data-d="day"]')&&draft){draft.day=+t.value;return;}
  if(t.matches('[data-p]')){
    const k=t.dataset.p; let v=t.type==='checkbox'?t.checked:(t.dataset.num!==undefined?num(t.value):t.value);
    if(k==='weeklyTarget') v=clamp(Math.round(v)||4,1,14);
    if((k==='startWeight'||k==='goalWeight')&&!(v>20&&v<400)){toast('Bitte ein gültiges Gewicht eingeben.','err');t.value=fmtInput(S.profile[k]);return;}
    if(k==='campaignStart'&&!v) return;
    if(k==='birthYear'){const y=new Date().getFullYear();if(t.value.trim()==='')v='';else if(!(v>=y-99&&v<=y-10)){toast('Bitte ein gültiges Geburtsjahr eingeben.','err');t.value=S.profile.birthYear;return;}}
    if(k==='height'){if(t.value.trim()==='')v='';else if(!(v>=120&&v<=230)){toast('Bitte Größe in cm eingeben (120–230).','err');t.value=S.profile.height;return;}}
    S.profile[k]=v; save(true);
    if(k==='wakeLock'){v?requestWake():releaseWake();}
    if(t.dataset.num!==undefined&&v!=='') t.value=(k==='weeklyTarget'||k==='birthYear'||k==='height')?v:fmtInput(v);
    if(['weeklyTarget','campaignStart','sex','birthYear','height'].includes(k)){const y=scrollY;render();scrollTo(0,y);} else renderChip();
    return;
  }
  if(t.matches('[data-pet]')){S.game.petName=t.value.trim().slice(0,16)||'Nox';save(true);const y=scrollY;render();scrollTo(0,y);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-f],input[data-c],#bw-in'))e.target.blur();if(e.key==='Escape')closeSheet();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active)requestWake();renderTimer();checkStageDrop();}else if(saveT)writeNow();});
addEventListener('pagehide',()=>{if(saveT)writeNow();});
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(drawCharts,150);});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(ui.tab==='profile')render();});
addEventListener('appinstalled',()=>{deferredInstall=null;toast('VIGIL installiert.','go');});

/* ---------- boot ---------- */
S=load(); loadUI();
if(S.active&&S.active.timerEnd&&S.active.timerEnd>Date.now()) timer={end:S.active.timerEnd,total:S.active.timerTotal||num(S.profile.restSec)||120};
if(S.active) requestWake();
render();
checkStageDrop();
try{navigator.storage?.persist?.();}catch{}
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW-Registrierung fehlgeschlagen',err)));
}
</script>
</body>
</html>
